name: deploy

# Builds a ready-to-run zip of the site and uploads it over FTP once the tests pass on main.
# Extract it by hand into public_html/ADP/project/: the zip never contains .env, so the
# server's configuration is kept.
#
# Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Variables: RELEASES_DIR (default: releases, outside public_html so the zip cannot be
#            downloaded from the web), FTP_PROTOCOL (default: ftps)

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build front-end assets
        # Wayfinder runs `php artisan` during the build, which needs an app key.
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          npm ci
          npm run build
          rm .env

      - name: Assemble release
        run: |
          mkdir -p dist

          rsync -a ./ dist/ \
            --exclude=.git --exclude=.github --exclude=dist \
            --exclude=node_modules --exclude=tests \
            --exclude=docker --exclude=compose.yaml --exclude=.dockerignore \
            --exclude='.env' --exclude='.env.*' \
            --exclude=resources/js --exclude=resources/css \
            --exclude=database/database.sqlite --exclude=.phpunit.cache \
            --exclude=package.json --exclude=package-lock.json --exclude=pnpm-workspace.yaml \
            --exclude=.npmrc --exclude=vite.config.ts --exclude=tsconfig.json --exclude=components.json

          # Keep the storage folder structure, never local runtime files.
          find dist/storage -type f ! -name .gitignore -delete

          # Dev-server leftovers would make the site load its assets from localhost.
          rm -f dist/public/hot dist/public/fonts-manifest.dev.json

      - name: Create zip
        id: zip
        run: |
          name="adp-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD).zip"
          (cd dist && zip -qr "../$name" .)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - name: Keep a copy on GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          retention-days: 14
          compression-level: 0

      - name: Upload zip over FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          RELEASES_DIR: ${{ vars.RELEASES_DIR || 'releases' }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          tls=""
          [ "$FTP_PROTOCOL" = "ftps" ] && tls="--ssl-reqd"
          dir="${RELEASES_DIR%/}"
          # One dated copy (history) and one stable name to extract.
          for target in "$ZIP" "adp-latest.zip"; do
            curl -sS --fail $tls --ftp-create-dirs --netrc-file <(printf 'machine %s login %s password %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD") \
              -T "$ZIP" "ftp://$FTP_SERVER/$dir/$target"
          done
          echo "::notice::Uploaded $dir/$ZIP and $dir/adp-latest.zip: extract into public_html/ADP/project/, then call the deploy hook."
