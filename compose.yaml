name: adp

x-env: &env
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-adp}
    DB_USERNAME: ${DB_USERNAME:-adp}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_SCHEME: smtp
    MAIL_USERNAME: ''
    MAIL_PASSWORD: ''

x-app: &app
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
    image: adp-app:dev
    volumes:
        - .:/var/www/html
        - node_modules:/var/www/html/node_modules
    environment: *env
    depends_on:
        app:
            condition: service_healthy

services:
    app:
        <<: *app
        environment:
            <<: *env
            BOOTSTRAP: 'true'
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'test -f vendor/autoload.php && test -f node_modules/.package-lock.json && php artisan --version > /dev/null',
                ]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 300s

    web:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    queue:
        <<: *app
        command: php artisan queue:listen --tries=1

    vite:
        <<: *app
        command: npm run dev
        ports:
            - '${VITE_PORT:-5173}:5173'
        environment:
            <<: *env
            VITE_HOST: 0.0.0.0
            VITE_HMR_HOST: localhost
            CHOKIDAR_USEPOLLING: 'true'

    mysql:
        image: mysql:8.4
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_DATABASE: ${DB_DATABASE:-adp}
            MYSQL_USER: ${DB_USERNAME:-adp}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-p${DB_PASSWORD:-secret}',
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        volumes:
            - redis:/data

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'

volumes:
    mysql:
    redis:
    node_modules:
